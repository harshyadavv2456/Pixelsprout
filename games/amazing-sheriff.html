<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/logo-icon.png">
<title>Amazing Sheriff — Pixelsprout</title>
<meta name="description" content="Play Amazing Sheriff free online, no download needed.">
<link rel="stylesheet" href="../styles.css">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  .embed-frame-wrap {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 10;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }
  .embed-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .fullscreen-btn {
    margin-top: 4px;
  }
  .source-note {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>
<div class="game-shell">
  <a class="back-link" href="../index.html">← back to Pixelsprout</a>
  <h1 class="game-title">Amazing Sheriff</h1>
  <div class="game-meta">Addictive</div>

  <div class="game-board-frame">
    <div class="embed-frame-wrap">
      <iframe src="https://play.gamepix.com/amazing-sheriff/embed?sid=P7924" allow="fullscreen; autoplay; screen-orientation;" scrolling="no" allowfullscreen title="Amazing Sheriff"></iframe>
    </div>
    <button class="action fullscreen-btn" onclick="
      
      const f = document.querySelector('.embed-frame-wrap');
      const req = f.requestFullscreen || f.webkitRequestFullscreen || f.msRequestFullscreen;
      if (req) req.call(f);
    ">⛶ Fullscreen</button>
    <p class="how-to">Hop between spinning planetoids as a daring sheriff in this quirky space adventure. Collect coins, dodge hazards, and perfect your timing to chain jumps for epic combos. Precision is key—one misstep could end your cosmic quest!</p>

    <div class="similar-games">
      <h3 class="similar-games-title">You might also like</h3>
      <div class="similar-games-grid" id="similar-games-grid"></div>
    </div>
    <script>
      fetch('../games-index.json')
        .then(r => r.json())
        .then(games => {
          const currentSlug = 'amazing-sheriff';
          const currentCategory = 'Addictive';
          let matches = games.filter(g => g.category === currentCategory && g.slug !== currentSlug);
          matches = matches.sort(() => 0.5 - Math.random());
          if (matches.length < 4) {
            const others = games.filter(g => g.slug !== currentSlug && !matches.some(m => m.slug === g.slug));
            matches = matches.concat(others.sort(() => 0.5 - Math.random()).slice(0, 4 - matches.length));
          }
          matches = matches.slice(0, 4);
          const grid = document.getElementById('similar-games-grid');
          matches.forEach(g => {
            const a = document.createElement('a');
            a.className = 'similar-card';
            a.href = g.slug + '.html';
            a.innerHTML = '<img src="' + g.thumbnail + '" alt="" loading="lazy"><span>' + g.title + '</span>';
            grid.appendChild(a);
          });
        })
        .catch(() => {});
    </script>
  </div>
</div>
</body>
</html>
