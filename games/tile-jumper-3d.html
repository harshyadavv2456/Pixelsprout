<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/logo-icon.png">
<title>Tile Jumper 3D — Pixelsprout</title>
<meta name="description" content="Play Tile Jumper 3D free online, no download needed.">
<link rel="stylesheet" href="../styles.css">
<script defer src="/_vercel/insights/script.js"></script>
<style>
  .embed-frame-wrap {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 10;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }
  .embed-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .fullscreen-btn {
    margin-top: 4px;
  }
  .source-note {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>
<div class="game-shell">
  <a class="back-link" href="../index.html">← back to Pixelsprout</a>
  <h1 class="game-title">Tile Jumper 3D</h1>
  <div class="game-meta">Music</div>

  <div class="game-board-frame">
    <div class="embed-frame-wrap">
      <iframe src="https://play.gamepix.com/tile-jumper-3d/embed?sid=P7924" allow="fullscreen; autoplay; screen-orientation;" scrolling="no" allowfullscreen title="Tile Jumper 3D"></iframe>
    </div>
    <button class="action fullscreen-btn" onclick="
      
      const f = document.querySelector('.embed-frame-wrap');
      const req = f.requestFullscreen || f.webkitRequestFullscreen || f.msRequestFullscreen;
      if (req) req.call(f);
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    ">⛶ Fullscreen</button>
    <p class="how-to">Leap in harmony with the beat as you navigate vibrant 3D tiles. Master perfect timing and concentration to keep the melody flowing. Challenge your skills, climb the leaderboard, and prove you're the ultimate tile jumper.</p>

    <div class="similar-games">
      <h3 class="similar-games-title">You might also like</h3>
      <div class="similar-games-grid" id="similar-games-grid"></div>
    </div>
    <script>
      fetch('../games-index.json')
        .then(r => r.json())
        .then(games => {
          const currentSlug = 'tile-jumper-3d';
          const currentCategory = 'Music';
          let matches = games.filter(g => g.category === currentCategory && g.slug !== currentSlug);
          matches = matches.sort(() => 0.5 - Math.random());
          if (matches.length < 4) {
            const others = games.filter(g => g.slug !== currentSlug && !matches.some(m => m.slug === g.slug));
            matches = matches.concat(others.sort(() => 0.5 - Math.random()).slice(0, 4 - matches.length));
          }
          matches = matches.slice(0, 4);
          const grid = document.getElementById('similar-games-grid');
          matches.forEach(g => {
            const a = document.createElement('a');
            a.className = 'similar-card';
            a.href = g.slug + '.html';
            a.innerHTML = '<img src="' + g.thumbnail + '" alt="" loading="lazy"><span>' + g.title + '</span>';
            grid.appendChild(a);
          });
        })
        .catch(() => {});
    </script>
  </div>
</div>
</body>
</html>
