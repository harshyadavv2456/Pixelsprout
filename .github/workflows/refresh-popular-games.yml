name: Refresh popular games snapshot

on:
  schedule:
    - cron: '0 5 * * *'   # daily, 5:00 UTC (~10:30 AM IST) - before the 6:00 UTC game-add run
  workflow_dispatch: {}   # also lets you trigger manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh-popular-games:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config --global user.name "Pixelsprout Auto-Bot"
          git config --global user.email "actions@github.com"

      - name: Refresh popular-games.json from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python refresh-popular-games.py

      - name: Commit updated snapshot
        run: |
          git add popular-games.json
          git commit -m "Daily popular games snapshot refresh" || echo "Nothing to commit"
          git push
