name: Post new games to Pinterest

on:
  schedule:
    - cron: "0 8 * * *"   # daily, 8:00 UTC (~1:30 PM IST) - after games are added
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-to-pinterest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Post to Pinterest
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_SANDBOX_TOKEN: ${{ secrets.PINTEREST_SANDBOX_TOKEN }}
        run: python post-to-pinterest.py

      - name: Commit updated tracking file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pinterest-posted.json
          git diff --staged --quiet || git commit -m "Update Pinterest posting tracker"
          git push
