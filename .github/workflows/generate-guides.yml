name: Generate guide & collection pages

on:
  schedule:
    - cron: '30 6 * * *'   # daily, 6:30 UTC - 30 min after auto-add-games.yml
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max games to process this run (leave blank for default batch size)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config --global user.name "Pixelsprout Auto-Bot"
          git config --global user.email "actions@github.com"

      - name: Test Groq connectivity
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
        run: python content-engine/test_groq_connection.py || echo "::warning::Groq connectivity test failed - this run will use fallback content"

      - name: Generate per-game guide pages
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
        run: |
          # --retry-fallback is always on: every run both picks up brand-new
          # games AND gradually upgrades old fallback-only pages to real AI
          # content, within whatever quota is actually available that day.
          # Limit is capped at 80 regardless of manual input - Groq's free-tier
          # daily token quota (100k/key x 5 keys) only supports ~40-65 games'
          # worth of real AI content per day; anything past that just burns
          # the day's budget producing fallback content for extra games with
          # no quality benefit, which is exactly what happened when this was
          # manually run with --limit 2890.
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            REQUESTED="${{ github.event.inputs.limit }}"
            CAPPED=$(( REQUESTED < 80 ? REQUESTED : 80 ))
            echo "Requested $REQUESTED, capped to $CAPPED (see comment above for why)"
            python content-engine/generate_guides.py --retry-fallback --limit "$CAPPED"
          else
            python content-engine/generate_guides.py --retry-fallback
          fi

      - name: Refresh "games like X" collection pages
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
        run: python content-engine/generate_collections.py

      - name: Commit and push new pages
        run: |
          git add guides games-like sitemap.xml guides-index.json content-engine/manifest.json
          git commit -m "Auto-generate guide/collection pages" || echo "Nothing to commit"
          git push
