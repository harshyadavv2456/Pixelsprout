name: Auto-add new games

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 6:00 UTC (~11:30 AM IST)
  workflow_dispatch: {}   # also lets you trigger manually from the Actions tab

permissions:
  contents: write

jobs:
  add-games:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure git identity
        run: |
          git config --global user.name "Pixelsprout Auto-Bot"
          git config --global user.email "actions@github.com"

      - name: Run auto-add script (GamePix)
        run: python auto-add-games.py

      - name: Run auto-add script (GameMonetize)
        run: python auto-add-gamemonetize.py

      - name: Refresh category pages
        run: |
          python generate-category-pages.py
          python add-category-pages-to-sitemap.py

      - name: Check catalog quality
        run: python check-catalog-quality.py

      - name: Commit category/quality updates
        run: |
          git add .
          git commit -m "Daily category page refresh" || echo "Nothing to commit"
          git push
